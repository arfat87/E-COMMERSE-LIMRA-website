<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LIMRA Restaurant — Table QR Labels Admin</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="icon" href="/images/logo.png" type="image/png">
  <style>
    :root {
      --bg: #111827;
      --card-bg: #1f2937;
      --gold: #c8860a;
      --gold-hover: #b07504;
      --border: rgba(255, 255, 255, 0.08);
      --text: #f3f4f6;
      --text-muted: #9ca3af;
    }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: 'Inter', sans-serif;
      margin: 0;
      padding: 0;
      min-height: 100vh;
    }

    header {
      background: rgba(17, 24, 39, 0.9);
      backdrop-filter: blur(12px);
      border-bottom: 1px solid var(--border);
      padding: 1.25rem 2rem;
      position: sticky;
      top: 0;
      z-index: 50;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 0.75rem;
    }

    .brand img {
      width: 2.25rem;
      height: 2.25rem;
      border-radius: 50%;
      border: 1.5px solid var(--gold);
    }

    .brand h1 {
      font-family: 'Outfit', sans-serif;
      font-size: 1.25rem;
      font-weight: 800;
      letter-spacing: 0.05em;
      margin: 0;
      color: var(--gold);
    }

    .brand h1 span {
      color: #fff;
    }

    .btn {
      background: var(--gold);
      color: #111827;
      font-weight: 700;
      font-size: 0.875rem;
      border: none;
      padding: 0.625rem 1.25rem;
      border-radius: 0.75rem;
      cursor: pointer;
      transition: all 0.2s ease;
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
    }

    .btn:hover {
      background: var(--gold-hover);
      transform: translateY(-1px);
    }

    .btn-outline {
      background: transparent;
      border: 1px solid var(--border);
      color: var(--text);
    }

    .btn-outline:hover {
      background: rgba(255, 255, 255, 0.05);
      border-color: rgba(255, 255, 255, 0.2);
    }

    main {
      max-width: 1200px;
      margin: 0 auto;
      padding: 2.5rem 1.5rem;
    }

    .page-title-block {
      margin-bottom: 2rem;
      display: flex;
      justify-content: space-between;
      align-items: flex-end;
      flex-wrap: wrap;
      gap: 1rem;
    }

    .page-title-block h2 {
      font-family: 'Outfit', sans-serif;
      font-size: 1.75rem;
      font-weight: 700;
      margin: 0;
    }

    .page-title-block p {
      color: var(--text-muted);
      font-size: 0.875rem;
      margin: 0.5rem 0 0 0;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
      gap: 1.5rem;
    }

    .qr-card {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 1.25rem;
      padding: 1.5rem;
      text-align: center;
      transition: all 0.2s ease;
      position: relative;
    }

    .qr-card:hover {
      border-color: rgba(200, 134, 10, 0.4);
      transform: translateY(-2px);
    }

    .qr-container {
      background: #1a1a1a;
      border: 2px solid var(--gold);
      padding: 1rem;
      border-radius: 1rem;
      width: 180px;
      height: 180px;
      margin: 0 auto 1.25rem auto;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .qr-container img {
      width: 100%;
      height: 100%;
      object-contain: cover;
    }

    .table-title {
      font-family: 'Outfit', sans-serif;
      font-size: 1.25rem;
      font-weight: 700;
      color: var(--gold);
      margin: 0 0 0.25rem 0;
    }

    .zone-badge {
      display: inline-block;
      font-size: 0.7rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      padding: 0.25rem 0.625rem;
      border-radius: 9999px;
      background: rgba(255, 255, 255, 0.05);
      color: var(--text-muted);
      margin-bottom: 1rem;
    }

    .zone-badge.indoor {
      background: rgba(59, 130, 246, 0.1);
      color: #60a5fa;
      border: 1px solid rgba(59, 130, 246, 0.2);
    }

    .zone-badge.outdoor {
      background: rgba(245, 158, 11, 0.1);
      color: #fbbf24;
      border: 1px solid rgba(245, 158, 11, 0.2);
    }

    .actions {
      display: flex;
      gap: 0.5rem;
      justify-content: center;
    }

    .actions .btn {
      flex: 1;
      justify-content: center;
      padding: 0.5rem 0.75rem;
      font-size: 0.8rem;
    }

    /* Print Styles */
    @media print {
      body {
        background: #fff;
        color: #000;
      }
      
      header, .no-print {
        display: none !important;
      }

      main {
        padding: 0;
      }

      .grid {
        display: block;
      }

      .qr-card {
        page-break-inside: avoid;
        background: #fff !important;
        border: 2px solid #000 !important;
        border-radius: 15px !important;
        width: 320px;
        margin: 20px auto;
        padding: 20px;
        box-shadow: none !important;
        float: none;
      }

      .qr-container {
        border-color: #000 !important;
        background: #fff !important;
      }

      .table-title {
        color: #000 !important;
      }

      .zone-badge {
        border: 1px solid #000 !important;
        color: #000 !important;
        background: none !important;
      }

      /* When printing a single card */
      .single-print-active .qr-card:not(.printing) {
        display: none !important;
      }
      
      .single-print-active .qr-card.printing {
        margin: 100px auto !important;
        width: 400px !important;
        padding: 40px !important;
        border: 4px solid #000 !important;
      }
    }
  </style>
</head>
<body>

  <header>
    <div class="brand">
      <img src="/images/logo.png" alt="LIMRA Logo">
      <h1>LIMRA <span>RESTAURANT</span></h1>
    </div>
    <div class="no-print">
      <a href="/admin.html" class="btn btn-outline" style="text-decoration: none; margin-right: 0.5rem;">
        ← Back to Admin
      </a>
      <button class="btn" onclick="printAll()">
        🖨️ Print All Labels (A4)
      </button>
    </div>
  </header>

  <main>
    <div class="page-title-block no-print">
      <div>
        <h2>Table QR Codes Preview</h2>
        <p>Preview and print labels for tables 1 to 19. Colors are configured for gold on dark theme scan cards.</p>
      </div>
    </div>

    <div class="grid" id="qr-grid">
      <!-- Generated dynamically -->
    </div>
  </main>

  <script>
    const totalTables = 19;
    const grid = document.getElementById('qr-grid');

    for (let i = 1; i <= totalTables; i++) {
      const isIndoor = i <= 9;
      const zoneName = isIndoor ? 'indoor' : 'outdoor';
      const zoneLabel = isIndoor ? '🪑 Indoor Area' : '🌳 Outdoor Area';
      const qrPath = `/images/qr/table-${i}.png`;
      const scanUrl = `https://limraresturent.in/table/?t=${i}`;

      const card = document.createElement('div');
      card.className = `qr-card`;
      card.id = `card-${i}`;
      card.innerHTML = `
        <div class="qr-container">
          <img src="${qrPath}" alt="Table ${i} QR Code">
        </div>
        <h3 class="table-title">Table ${i}</h3>
        <span class="zone-badge ${zoneName}">${zoneLabel}</span>
        <div class="actions no-print">
          <button class="btn btn-outline" onclick="printSingle(${i})">🖨️ Print</button>
          <a href="${qrPath}" download="table_${i}_qr.png" class="btn" style="text-decoration:none;">📥 Download</a>
        </div>
      `;
      grid.appendChild(card);
    }

    function printAll() {
      document.body.classList.remove('single-print-active');
      document.querySelectorAll('.qr-card').forEach(c => c.classList.remove('printing'));
      window.print();
    }

    function printSingle(id) {
      document.body.classList.add('single-print-active');
      document.querySelectorAll('.qr-card').forEach(c => {
        if (c.id === `card-${id}`) {
          c.classList.add('printing');
        } else {
          c.classList.remove('printing');
        }
      });
      window.print();
    }
  </script>
</body>
</html>
